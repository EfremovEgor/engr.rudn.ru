# Продакшен: сайт в контейнере, PostgreSQL и nginx остаются на хосте.
# network_mode: host — контейнер ходит в Postgres на localhost хоста и слушает 127.0.0.1:8000,
# куда проксирует nginx (см. nginx/engr). Медиафайлы и переводы — на хосте (bind mount).
services:
  web:
    build: .
    image: academy-site:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      GUNICORN_BIND: 127.0.0.1:8000
      RELOAD_WORKERS_ON_TRANSLATION: "1"
    volumes:
      - ./src/uploads:/app/src/uploads
      - ./src/locale:/app/src/locale
